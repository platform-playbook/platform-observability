alertmanager:
  config:
    global:
      resolve_timeout: 5m

    inhibit_rules:
      - source_matchers:
          - 'severity = critical'
        target_matchers:
          - 'severity =~ warning|info'
        equal:
          - 'namespace'
          - 'alertname'

      - source_matchers:
          - 'severity = warning'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
          - 'alertname'

      - source_matchers:
          - 'alertname = InfoInhibitor'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'

      - target_matchers:
          - 'alertname = InfoInhibitor'

    route:
      group_by:
        - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'

      routes:
        - receiver: 'platform-critical'
          matchers:
            - 'service = orders'
            - 'severity = critical'

        - receiver: 'null'
          matchers:
            - 'alertname = "Watchdog"'

    receivers:
      - name: 'null'

      - name: 'platform-critical'
        webhook_configs:
          - url: 'http://alert-receiver.platform.svc.cluster.local:8000'

    templates:
      - '/etc/alertmanager/config/*.tmpl'
