apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: platform-services
      rules:
        - alert: OrdersHighErrorRate
          expr: |
            100 *
            sum by (service) (
              rate(http_requests_total{
                service="orders",
                status=~"5.."
              }[5m])
            )
            /
            sum by (service) (
              rate(http_requests_total{
                service="orders"
              }[5m])
            )
            > 5
          for: 2m
          labels:
            severity: critical
            service: orders
          annotations:
            summary: "Orders service has a high 5xx error rate"
            description: "Orders is returning more than 5% 5xx responses for 2 minutes."
