apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: platformobservabilityrtr.azurecr.io/orders:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: PAYMENTS_URL
              value: "http://payments:8000"
            - name: FRAUD_URL
              value: "http://fraud:8000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  labels:
    monitoring: platform-app
  name: orders
  namespace: platform
spec:
  type: ClusterIP
  selector:
    app: orders
  ports:
    - name: http
      port: 8000
      targetPort: 8000
